suite_id: portfolio-prompt-comparison
version: 3
motivation: Version 3 repeats the unchanged constrained-output comparison with the hosted OpenAI Responses API to determine whether the prompt treatment effect persists under a different model and provider.
relationship_to_earlier: Version 3 is a separate experiment and does not replace, rescore, pool with, or alter versions 1 and 2.
provider: openai
model: gpt-6-luna
repetitions: 5
order_strategy: alternating
request_timeout_seconds: 180
settings:
  temperature: 0
  max_tokens: 3072
  seed: 0
  context_size: 0
  reasoning_effort: low
sampling_policy: The Responses API request fixes low reasoning effort. Temperature, seed, and local context-size controls are not sent to this hosted reasoning model; five repetitions measure the remaining variation.
output_limit_rationale: The unchanged schema permits at most six concise observations and five limitations. Its field limits keep the expected response below approximately 8000 characters; 3072 output tokens provides margin above that bounded response while remaining finite and equal for both conditions.
